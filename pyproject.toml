[project]
name = "spinewatch"
version = "0.1.0"
description = "Tracks book prices across online stores and records daily price history."
readme = "README.md"
requires-python = ">=3.13,<3.15"

# Upper bound is not arbitrary: selectolax declares `<3.15`, so the package
# cannot claim support the dependency tree does not have.
dependencies = [
    "typer>=0.27,<1.0",       # CLI. Pure Python.
    "curl_cffi>=0.15,<0.16",  # HTTP with Chrome TLS/JA3 impersonation. abi3 wheels.
    "selectolax>=0.4.11,<0.5" # HTML parsing. Chosen over lxml/bs4 for footprint.
]

[project.optional-dependencies]
# Installed only in the `runtime-browser` image. Keeping this out of the base
# dependency set is what lets the browser-free image exist, and is why
# fetching/browser.py must import playwright inside its constructor rather
# than at module scope.
browser = ["playwright>=1.61,<2.0"]
api = ["fastapi>=0.115,<1.0", "uvicorn>=0.34,<1.0"]

[project.scripts]
books = "spinewatch.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
    "httpx>=0.28,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spinewatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
