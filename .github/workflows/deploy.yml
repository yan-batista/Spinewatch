name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Test
        run: |
          pip install -e ".[api]" pytest httpx
          pytest

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push crawl image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-browser
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/spinewatch:crawl
          cache-from: type=gha,scope=crawl
          cache-to: type=gha,mode=max,scope=crawl

      - name: Build & push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/spinewatch:api
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Deploy to VM
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned, not ssh-keyscan'd: scanning on every run trusts whatever
          # answers on VM_HOST at that moment, which hands the deploy key to
          # anyone who can spoof it. Regenerate with:
          #   ssh-keyscan -H <vm-host>
          echo "${{ secrets.VM_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          rsync -az --delete --exclude=config.js -e "ssh -i ~/.ssh/deploy_key" frontend/ "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/srv/spinewatch/frontend/"
          ssh -i ~/.ssh/deploy_key "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" 'bash -s' < deploy/remote-deploy.sh
